  <circle cx="980" cy="168" r="22" fill="#7C3AED" opacity="0.8" />
  <circle cx="980" cy="158" r="10" fill="#FFFFFF" opacity="0.85" />
  <path d="M962 190 C962 178 970 172 980 172 C990 172 998 178 998 190" fill="#FFFFFF" opacity="0.6" />
