  <rect x="440" y="305" width="68" height="26" rx="10" fill="#7C3AED" opacity="0.8" />
  <text x="474" y="322" fill="#F3E8FF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Friction</text>

