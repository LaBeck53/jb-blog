  <text x="756" y="448" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">Insight validé → Décision produit</text>

  <!-- Title -->
  <text x="80" y="540" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">User Research</text>
