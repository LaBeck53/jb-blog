  <rect x="958" y="202" width="164" height="6" rx="3" fill="#FFFFFF" opacity="0.2" />
  <rect x="958" y="216" width="130" height="6" rx="3" fill="#FFFFFF" opacity="0.15" />
  <rect x="958" y="230" width="150" height="6" rx="3" fill="#FFFFFF" opacity="0.1" />

  <!-- Interview / research cards -->
  <rect x="720" y="290" width="420" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#C4B5FD" stroke-opacity="0.2" stroke-width="1" />
  <rect x="736" y="307" width="8" height="8" rx="2" fill="#A855F7" opacity="0.8" />
  <text x="756" y="320" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.8">Entretien utilisateur · 12 interviews</text>

  <rect x="720" y="354" width="420" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#C4B5FD" stroke-opacity="0.2" stroke-width="1" />
  <rect x="736" y="371" width="8" height="8" rx="2" fill="#9333EA" opacity="0.8" />
  <text x="756" y="384" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.8">Analyse qualitative · Thèmes émergents</text>

  <rect x="720" y="418" width="420" height="50" rx="12" fill="#7C3AED" fill-opacity="0.3" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
