  <line x1="538" y1="388" x2="610" y2="460" stroke="#D8B4FE" stroke-width="18" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="538" y1="388" x2="610" y2="460" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />

