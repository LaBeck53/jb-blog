  <circle cx="420" cy="270" r="160" fill="url(#glass)" stroke="#D8B4FE" stroke-opacity="0.3" stroke-width="3" />
  <circle cx="420" cy="270" r="130" fill="none" stroke="#D8B4FE" stroke-opacity="0.12" stroke-width="1" />
