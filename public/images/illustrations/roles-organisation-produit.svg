  <text x="370" y="415" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  <text x="370" y="428" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ops</text>

