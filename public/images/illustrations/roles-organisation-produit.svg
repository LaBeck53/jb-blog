  <circle cx="370" cy="275" r="16" fill="#6D28D9" opacity="0.8" />
  <text x="370" y="279" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PM</text>
