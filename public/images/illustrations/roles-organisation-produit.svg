<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles bg -->
  <circle cx="1050" cy="100" r="200" fill="#7C3AED" opacity="0.07" />
  <circle cx="150" cy="500" r="160" fill="#A78BFA" opacity="0.07" />

  <!-- Central node (Product Team) -->
  <circle cx="600" cy="295" r="62" fill="#7C3AED" opacity="0.9" />
  <circle cx="600" cy="295" r="50" fill="#FFFFFF" opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="600" y="288" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRODUCT</text>
  <text x="600" y="305" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TEAM</text>

  <!-- Connector lines -->
  <line x1="548" y1="260" x2="430" y2="185" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <line x1="548" y1="295" x2="430" y2="295" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <line x1="548" y1="330" x2="430" y2="405" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <line x1="652" y1="260" x2="770" y2="185" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <line x1="652" y1="295" x2="770" y2="295" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />
  <line x1="652" y1="330" x2="770" y2="405" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 4" />

  <!-- Satellite node: Product Owner -->
  <rect x="310" y="140" width="120" height="90" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="370" cy="165" r="16" fill="#7C3AED" opacity="0.8" />
  <text x="370" y="169" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PO</text>
  <text x="370" y="195" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  <text x="370" y="208" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Owner</text>

