  <rect x="770" y="140" width="120" height="90" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="830" cy="165" r="16" fill="#8B5CF6" opacity="0.8" />
  <text x="830" y="169" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">UX</text>
  <text x="830" y="195" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  <text x="830" y="208" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Designer</text>

  <!-- Satellite node: PMM -->
  <rect x="770" y="250" width="120" height="90" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="830" cy="275" r="16" fill="#7C3AED" opacity="0.8" />
  <text x="830" y="279" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">PMM</text>
  <text x="830" y="305" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  <text x="830" y="318" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Marketing</text>

  <!-- Satellite node: Builder -->
  <rect x="770" y="360" width="120" height="90" rx="16" fill="url(#card)" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="830" cy="385" r="16" fill="#6D28D9" opacity="0.8" />
  <text x="830" y="389" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">DEV</text>
  <text x="830" y="415" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Product</text>
  <text x="830" y="428" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Builder</text>

  <!-- Title -->
  <text x="80" y="542" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Organisation Produit</text>
  <text x="80" y="587" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" opacity="0.7">Rôles, interactions et nouvelles appellations</text>
</svg>
