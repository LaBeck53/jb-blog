<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#052E16" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="100" r="200" fill="#22C55E" opacity="0.05" />

  <!-- Dashboard frame -->
  <rect x="100" y="100" width="1000" height="380" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#22C55E" stroke-opacity="0.15" stroke-width="1" />

  <!-- Top KPI cards -->
  <rect x="120" y="120" width="200" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.08" />
  <text x="220" y="152" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">RÉTENTION</text>
  <text x="220" y="180" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">78%</text>

  <rect x="340" y="120" width="200" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.08" />
  <text x="440" y="152" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">ACTIVATION</text>
  <text x="440" y="180" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">42%</text>

  <rect x="560" y="120" width="200" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.08" />
  <text x="660" y="152" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">NPS</text>
  <text x="660" y="180" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">+62</text>

  <rect x="780" y="120" width="200" height="80" rx="12" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1" />
  <text x="880" y="152" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">REVENU MRR</text>
  <text x="880" y="180" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">↑ 18%</text>

  <!-- Bar chart -->
  <text x="140" y="240" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" opacity="0.8">Métriques clés vs vanity metrics</text>

  <!-- Bars -->
  <!-- Jan -->
  <rect x="155" y="380" width="60" height="80" rx="6" fill="url(#barA)" opacity="0.5" />
  <text x="185" y="398" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.6">JAN</text>

  <!-- Feb -->
  <rect x="240" y="340" width="60" height="120" rx="6" fill="url(#barA)" opacity="0.65" />
  <text x="270" y="358" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.6">FEV</text>

  <!-- Mar -->
  <rect x="325" y="310" width="60" height="150" rx="6" fill="url(#barA)" opacity="0.75" />
  <text x="355" y="328" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.6">MAR</text>

  <!-- Apr -->
  <rect x="410" y="280" width="60" height="180" rx="6" fill="url(#barB)" opacity="0.8" />
  <text x="440" y="298" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.7">AVR</text>

  <!-- May -->
  <rect x="495" y="255" width="60" height="205" rx="6" fill="url(#barB)" opacity="0.88" />
  <text x="525" y="273" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.7">MAI</text>

  <!-- Jun -->
  <rect x="580" y="225" width="60" height="235" rx="6" fill="url(#barC)" opacity="0.9" />
  <text x="610" y="243" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">JUIN</text>

  <!-- Trend line -->
  <polyline points="185,370 270,330 355,300 440,270 525,245 610,215" stroke="#4ADE80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Trend dots -->
  <circle cx="185" cy="370" r="5" fill="#4ADE80" />
  <circle cx="270" cy="330" r="5" fill="#4ADE80" />
  <circle cx="355" cy="300" r="5" fill="#4ADE80" />
  <circle cx="440" cy="270" r="5" fill="#4ADE80" />
  <circle cx="525" cy="245" r="5" fill="#4ADE80" />
  <circle cx="610" cy="215" r="7" fill="#FFFFFF" stroke="#4ADE80" stroke-width="2" />

  <!-- Right mini chart (pie-like) -->
  <circle cx="870" cy="330" r="80" fill="none" stroke="#22C55E" stroke-opacity="0.2" stroke-width="1" />
  <!-- Pie segments -->
  <path d="M870 330 L870 250 A80 80 0 0 1 942 294 Z" fill="#4ADE80" opacity="0.8" />
  <path d="M870 330 L942 294 A80 80 0 0 1 920 405 Z" fill="#86EFAC" opacity="0.6" />
  <path d="M870 330 L920 405 A80 80 0 0 1 798 366 Z" fill="#22C55E" opacity="0.5" />
  <path d="M870 330 L798 366 A80 80 0 0 1 870 250 Z" fill="#16A34A" opacity="0.4" />
  <circle cx="870" cy="330" r="36" fill="#0F2318" />
  <text x="870" y="325" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NORTH</text>
  <text x="870" y="340" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAR</text>

  <!-- Title -->
  <text x="80" y="540" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Métriques Produit</text>
  <text x="80" y="585" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" opacity="0.7">Au-delà des vanity metrics</text>
</svg>
