<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Background decorative circles -->
  <circle cx="1100" cy="80" r="180" fill="#38BDF8" opacity="0.06" />
  <circle cx="100" cy="550" r="150" fill="#0284C7" opacity="0.08" />

  <!-- Central timeline track -->
  <rect x="140" y="290" width="920" height="10" rx="5" fill="#FFFFFF" opacity="0.15" />

  <!-- Phase 1 -->
  <circle cx="240" cy="295" r="22" fill="#38BDF8" opacity="0.9" />
  <circle cx="240" cy="295" r="10" fill="#FFFFFF" />
  <rect x="190" y="180" width="100" height="90" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  <rect x="205" y="196" width="70" height="8" rx="4" fill="#38BDF8" opacity="0.9" />
  <rect x="205" y="212" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="205" y="224" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.35" />
  <rect x="205" y="236" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.25" />
  <line x1="240" y1="270" x2="240" y2="273" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Phase 2 -->
  <circle cx="460" cy="295" r="22" fill="#22D3EE" opacity="0.9" />
  <circle cx="460" cy="295" r="10" fill="#FFFFFF" />
  <rect x="410" y="350" width="100" height="90" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  <rect x="425" y="366" width="70" height="8" rx="4" fill="#22D3EE" opacity="0.9" />
  <rect x="425" y="382" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="425" y="394" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.35" />
  <rect x="425" y="406" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.25" />
  <line x1="460" y1="317" x2="460" y2="350" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Phase 3 -->
  <circle cx="680" cy="295" r="22" fill="#7DD3FC" opacity="0.9" />
  <circle cx="680" cy="295" r="10" fill="#FFFFFF" />
  <rect x="630" y="180" width="100" height="90" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  <rect x="645" y="196" width="70" height="8" rx="4" fill="#7DD3FC" opacity="0.9" />
  <rect x="645" y="212" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="645" y="224" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.35" />
  <rect x="645" y="236" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.25" />
  <line x1="680" y1="270" x2="680" y2="273" stroke="#7DD3FC" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Phase 4 / Flag -->
  <circle cx="900" cy="295" r="26" fill="#FFFFFF" opacity="0.95" />
  <circle cx="900" cy="295" r="14" fill="#0EA5E9" />
  <rect x="850" y="350" width="100" height="90" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
  <rect x="865" y="366" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />
  <rect x="865" y="382" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />
  <rect x="865" y="394" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.35" />
  <rect x="865" y="406" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.25" />
  <line x1="900" y1="317" x2="900" y2="350" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Arrow end -->
  <polygon points="1060,295 1040,280 1040,310" fill="#FFFFFF" opacity="0.7" />

  <!-- Labels -->
  <text x="198" y="165" fill="#38BDF8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">Q1</text>
  <text x="418" y="460" fill="#22D3EE" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">Q2</text>
  <text x="638" y="165" fill="#7DD3FC" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">Q3</text>
  <text x="858" y="460" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" opacity="0.9">Q4</text>

  <!-- Title -->
  <text x="80" y="540" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Roadmap Produit</text>
  <text x="80" y="585" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" opacity="0.7">Établir votre feuille de route en 10 étapes</text>
</svg>
