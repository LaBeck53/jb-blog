<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="compass-face" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Background glow -->
  <circle cx="600" cy="280" r="300" fill="#EF4444" opacity="0.05" />
  <circle cx="200" cy="100" r="150" fill="#F87171" opacity="0.05" />

  <!-- Compass outer ring -->
  <circle cx="560" cy="270" r="190" fill="url(#compass-face)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="560" cy="270" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Cardinal directions -->
  <text x="560" y="108" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" opacity="0.9">N</text>
  <text x="560" y="448" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" opacity="0.5">S</text>
  <text x="380" y="278" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" opacity="0.5">W</text>
  <text x="742" y="278" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" opacity="0.5">E</text>

  <!-- Tick marks -->
  <line x1="560" y1="122" x2="560" y2="138" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />
  <line x1="560" y1="402" x2="560" y2="418" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />
  <line x1="392" y1="270" x2="408" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />
  <line x1="712" y1="270" x2="728" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />

  <!-- Compass needle (pointing North - direction) -->
  <polygon points="560,148 548,278 560,298 572,278" fill="#FFFFFF" opacity="0.9" />
  <polygon points="560,298 548,278 560,392 572,278" fill="#EF4444" opacity="0.7" />
  <!-- Center dot -->
  <circle cx="560" cy="270" r="12" fill="#FFFFFF" opacity="0.9" />
  <circle cx="560" cy="270" r="6" fill="#DC2626" />

  <!-- People icons (stakeholders) -->
  <!-- Person 1 -->
  <circle cx="160" cy="200" r="24" fill="#F87171" opacity="0.7" />
  <path d="M120 300 C120 268 138 252 160 252 C182 252 200 268 200 300" fill="#F87171" opacity="0.5" />

  <!-- Person 2 -->
  <circle cx="260" cy="230" r="20" fill="#FECACA" opacity="0.6" />
  <path d="M228 316 C228 290 244 276 260 276 C276 276 292 290 292 316" fill="#FECACA" opacity="0.4" />

  <!-- Person 3 -->
  <circle cx="160" cy="380" r="20" fill="#F87171" opacity="0.6" />
  <path d="M128 460 C128 436 144 422 160 422 C176 422 192 436 192 460" fill="#F87171" opacity="0.4" />

  <!-- Arrow from people group to compass -->
  <path d="M210 270 Q310 270 365 270" stroke="#FECACA" stroke-width="2.5" stroke-opacity="0.6" fill="none" stroke-dasharray="6 4" />
  <polygon points="365,263 382,270 365,277" fill="#FECACA" opacity="0.7" />

  <!-- Right side: Change steps -->
  <rect x="800" y="140" width="300" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  <text x="836" y="163" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">01</text>
  <text x="866" y="163" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Définir la vision du changement</text>
  <text x="836" y="183" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.5">Alignement sur le pourquoi</text>

  <rect x="800" y="216" width="300" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  <text x="836" y="239" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">02</text>
  <text x="866" y="239" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Identifier les parties prenantes</text>
  <text x="836" y="259" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.5">Cartographier les acteurs clés</text>

  <rect x="800" y="292" width="300" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  <text x="836" y="315" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">03</text>
  <text x="866" y="315" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Communiquer et embarquer</text>
  <text x="836" y="335" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.5">Créer l'adhésion progressive</text>

  <rect x="800" y="368" width="300" height="60" rx="14" fill="#DC2626" fill-opacity="0.3" stroke="#F87171" stroke-opacity="0.4" stroke-width="1" />
  <text x="836" y="391" fill="#FCA5A5" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">04</text>
  <text x="866" y="391" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Ancrer dans la durée</text>
  <text x="836" y="411" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.5">Mesurer et pérenniser</text>

  <!-- Connector lines between steps -->
  <line x1="950" y1="200" x2="950" y2="216" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="950" y1="276" x2="950" y2="292" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="950" y1="352" x2="950" y2="368" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Title -->
  <text x="80" y="540" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Conduire le Changement</text>
  <text x="80" y="585" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" opacity="0.7">Embarquer toutes les parties prenantes</text>
</svg>
